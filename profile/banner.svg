<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title description">
  <title id="title">Mr.Cyprinus — 以代码为舟，赴星辰大海。</title>
  <desc id="description">A narrow banner fading from a warm dusk on the left to a deep blue night with a few stars on the right.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b86b69"/>
      <stop offset=".3" stop-color="#624566"/>
      <stop offset=".62" stop-color="#272b50"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0" cy="1" r=".72">
      <stop offset="0" stop-color="#edb47d" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#dc937d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#dc937d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" x2="1">
      <stop offset="0" stop-color="#f0bf91" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#cda4bc" stop-opacity=".12"/>
      <stop offset="1" stop-color="#cda4bc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="200" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="200" fill="url(#sky)"/>
    <rect width="1200" height="200" fill="url(#dusk)"/>
    <path d="M0 178C213 168 342 181 552 171S950 175 1200 162" fill="none" stroke="url(#horizon)"/>
    <g fill="#f6e7d3">
      <circle cx="760" cy="48" r="1" opacity=".45"/>
      <circle cx="866" cy="115" r="1" opacity=".5"/>
      <circle cx="916" cy="35" r=".8" opacity=".5"/>
      <circle cx="1058" cy="48" r="1.2" opacity=".7"/>
      <circle cx="1129" cy="116" r=".8" opacity=".45"/>
      <circle cx="988" cy="148" r=".8" opacity=".4"/>
      <path d="M1000 75L1001.5 82.5L1009 84L1001.5 85.5L1000 93L998.5 85.5L991 84L998.5 82.5Z" opacity=".85"/>
    </g>
    <text x="60" y="91" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="43" letter-spacing="-.8">Mr.Cyprinus</text>
    <text x="63" y="132" fill="#f4e1d9" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" letter-spacing="1.2">以代码为舟，赴星辰大海。</text>
  </g>
</svg>
