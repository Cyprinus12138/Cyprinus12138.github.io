<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Mr.Cyprinus — Code, curiosity &amp; the cosmos.</title>
  <desc id="description">A romantic twilight sky with a golden sunset at the lower left, rose and violet clouds, and sparse stars over a deep blue sea. 追求星辰大海的浪漫主义技术工程师。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7ad64"/>
      <stop offset=".16" stop-color="#da6a82"/>
      <stop offset=".34" stop-color="#754170"/>
      <stop offset=".6" stop-color="#23234e"/>
      <stop offset="1" stop-color="#080e20"/>
    </linearGradient>
    <radialGradient id="sunset" cx="0" cy="1" r=".85">
      <stop offset="0" stop-color="#ffda8b" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#ff9d63" stop-opacity=".5"/>
      <stop offset=".58" stop-color="#ee668c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ee668c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="1" x2="1" y2="0">
